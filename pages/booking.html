<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro Canvas — Booking & Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── RESET & TOKENS ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ivory:    #F7F4EF;
      --warm:     #EDE8DF;
      --dust:     #C9B99A;
      --charcoal: #2A2826;
      --mist:     #8A847C;
      --accent:   #B8956A;
      --white:    #FDFCFA;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'Jost', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ivory);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 15px;
      color: var(--charcoal);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--charcoal);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-logo {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--white);
      letter-spacing: 0.02em;
    }
    .topbar-logo em { color: var(--accent); font-style: italic; }
    .topbar-sub {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dust);
    }

    /* ── WRAPPER ── */
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    /* ── STEP TABS ── */
    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border: 1px solid var(--warm);
      margin-bottom: 40px;
      overflow: hidden;
    }
    .step-tab {
      padding: 14px 8px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mist);
      background: var(--white);
      border-right: 1px solid var(--warm);
      cursor: default;
      transition: background 0.2s, color 0.2s;
    }
    .step-tab:last-child { border-right: none; }
    .step-tab.active { background: var(--charcoal); color: var(--white); }
    .step-tab.done   { background: var(--warm); color: var(--accent); }
    .step-num { display: block; font-family: var(--serif); font-size: 22px; font-weight: 300; margin-bottom: 2px; }

    /* ── FORM PAGES ── */
    .fpage { display: none; }
    .fpage.active { display: block; }

    /* ── SECTION TITLES ── */
    .sec-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 300;
      color: var(--charcoal);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--warm);
      margin-bottom: 24px;
    }
    .sec-title em { font-style: italic; color: var(--accent); }
    .sec-block { margin-bottom: 36px; }

    /* ── FIELDS ── */
    .fg { display: flex; flex-direction: column; gap: 6px; }
    .fl {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mist);
    }
    .fl .req { color: var(--accent); }

    input[type=text], input[type=tel], input[type=email],
    input[type=number], input[type=date], input[type=time],
    select, textarea {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 300;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--warm);
      padding: 11px 14px;
      outline: none;
      width: 100%;
      appearance: none;
      transition: border-color 0.2s;
      border-radius: 0;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input.err, select.err { border-color: #c0392b; }
    textarea { resize: vertical; min-height: 86px; }
    input[readonly] { background: var(--warm); color: var(--mist); cursor: default; }

    /* ── GRID ── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
    .g1 { display: grid; grid-template-columns: 1fr; gap: 18px; }

    /* ── EVENT ROWS ── */
    .ev-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .ev-row {
      background: var(--warm);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.8fr 1.6fr 36px;
      gap: 10px;
      align-items: end;
    }
    .ev-del {
      width: 34px; height: 34px;
      background: none;
      border: 1px solid var(--dust);
      color: var(--mist);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .ev-del:hover { background: #c0392b; border-color: #c0392b; color: white; }
    .add-ev {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--sans);
      font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); background: none;
      border: 1px solid var(--dust); padding: 9px 18px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .add-ev:hover { border-color: var(--accent); }

    /* ── PACKAGE GRID ── */
    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: var(--warm);
      padding: 3px;
      margin-bottom: 24px;
    }
    .pkg-opt input[type=radio] { display: none; }
    .pkg-label {
      display: block;
      background: var(--white);
      padding: 16px 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .pkg-opt input:checked + .pkg-label {
      border-color: var(--accent);
      background: rgba(184,149,106,0.07);
    }
    .pkg-cat {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--mist); margin-bottom: 4px;
    }
    .pkg-name { font-family: var(--serif); font-size: 17px; font-weight: 400; color: var(--charcoal); margin-bottom: 2px; }
    .pkg-price { font-size: 13px; color: var(--accent); }

    /* ── NAV BUTTONS ── */
    .fnav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--warm);
      gap: 12px;
    }
    .btn-back {
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--mist); background: none;
      border: 1px solid var(--warm); padding: 12px 24px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-back:hover { border-color: var(--charcoal); color: var(--charcoal); }
    .btn-next {
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--white); background: var(--charcoal);
      border: none; padding: 13px 32px; cursor: pointer; transition: background 0.2s;
    }
    .btn-next:hover { background: var(--accent); }

    /* ── INVOICE ── */
    .inv-box {
      background: var(--white);
      border: 1px solid var(--warm);
      padding: 52px;
    }
    .inv-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 36px; padding-bottom: 28px;
      border-bottom: 2px solid var(--charcoal);
    }
    .inv-logo { font-family: var(--serif); font-size: 30px; font-weight: 400; color: var(--charcoal); }
    .inv-logo em { color: var(--accent); font-style: italic; }
    .inv-logo-sub { font-size: 12px; color: var(--mist); line-height: 1.8; margin-top: 6px; }
    .inv-meta { text-align: right; }
    .inv-title { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--charcoal); margin-bottom: 6px; }
    .inv-meta-detail { font-size: 12px; color: var(--mist); line-height: 1.9; }

    .inv-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-bottom: 32px; }
    .inv-party-lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .inv-party-name { font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--charcoal); margin-bottom: 4px; }
    .inv-party-det { font-size: 13px; color: var(--mist); line-height: 1.7; }

    .inv-tbl { width: 100%; border-collapse: collapse; margin-bottom: 28px; font-size: 13px; }
    .inv-tbl th { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist); padding: 9px 0; border-bottom: 1px solid var(--warm); text-align: left; }
    .inv-tbl th.right { text-align: right; }
    .inv-tbl td { padding: 12px 0; border-bottom: 1px solid var(--warm); vertical-align: top; color: var(--charcoal); }
    .inv-tbl td.right { text-align: right; }
    .inv-tbl .sub { font-size: 11px; color: var(--mist); display: block; margin-top: 2px; }

    .inv-totals { margin-left: auto; width: 280px; }
    .inv-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13px; color: var(--mist); }
    .inv-row.pkg-row { font-family: var(--serif); font-size: 18px; color: var(--charcoal); border-top: 2px solid var(--charcoal); margin-top: 8px; padding-top: 12px; }
    .inv-row.adv { color: var(--accent); }
    .inv-row.bal { color: var(--charcoal); font-weight: 500; border-top: 1px solid var(--warm); margin-top: 4px; padding-top: 10px; font-size: 15px; }

    .inv-terms {
      margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--warm);
      font-size: 12px; color: var(--mist); line-height: 1.8;
    }
    .inv-terms strong { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--charcoal); margin-bottom: 6px; }

    .inv-foot {
      margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--warm);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--mist);
    }
    .inv-foot-brand { font-family: var(--serif); font-size: 16px; color: var(--charcoal); }
    .inv-foot-brand em { color: var(--accent); font-style: italic; }
    .inv-foot-right { text-align: right; line-height: 1.7; }

    /* ── INVOICE ACTIONS ── */
    .inv-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .btn-print {
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--white); background: var(--charcoal);
      border: none; padding: 13px 28px; cursor: pointer; transition: background 0.2s;
    }
    .btn-print:hover { background: var(--accent); }
    .btn-sheet {
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--charcoal); background: none;
      border: 1px solid var(--charcoal); padding: 13px 28px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-sheet:hover { background: var(--charcoal); color: var(--white); }
    .btn-new {
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--mist); background: none;
      border: 1px solid var(--warm); padding: 13px 28px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-new:hover { border-color: var(--charcoal); color: var(--charcoal); }

    .sheet-msg { margin-top: 12px; font-size: 13px; display: none; padding: 12px 16px; }
    .sheet-msg.ok  { background: #e8f5ee; color: #1a7a4a; display: block; }
    .sheet-msg.err { background: #fdecea; color: #c0392b; display: block; }

    /* ── PRINT ── */
    @media print {
      .topbar, .steps, .fnav, .inv-actions, .sheet-msg,
      #pg1, #pg2, #pg3 { display: none !important; }
      .fpage#pg4 { display: block !important; }
      .wrap { padding: 0; max-width: 100%; }
      .inv-box { border: none; padding: 0; }
      body { background: white; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .topbar { padding: 14px 20px; }
      .wrap { padding: 32px 16px 60px; }
      .g2, .g3 { grid-template-columns: 1fr; }
      .ev-row { grid-template-columns: 1fr 1fr; }
      .ev-row .fg:nth-child(4) { grid-column: span 2; }
      .pkg-grid { grid-template-columns: 1fr 1fr; }
      .inv-box { padding: 28px 20px; }
      .inv-head { flex-direction: column; gap: 16px; }
      .inv-meta { text-align: left; }
      .inv-parties { grid-template-columns: 1fr; gap: 20px; }
      .inv-totals { width: 100%; }
    }
    @media (max-width: 400px) {
      .pkg-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">Retro <em>Canvas</em></div>
  <div class="topbar-sub">Booking &amp; Invoice System</div>
</div>

<div class="wrap">

  <!-- STEP TABS -->
  <div class="steps">
    <div class="step-tab active" id="tab1"><span class="step-num">1</span>Client</div>
    <div class="step-tab"        id="tab2"><span class="step-num">2</span>Events</div>
    <div class="step-tab"        id="tab3"><span class="step-num">3</span>Package</div>
    <div class="step-tab"        id="tab4"><span class="step-num">4</span>Invoice</div>
  </div>

  <!-- ══ PAGE 1 — CLIENT ══ -->
  <div class="fpage active" id="pg1">

    <div class="sec-block">
      <div class="sec-title">Booking person</div>
      <div class="g2">
        <div class="fg">
          <label class="fl">Full name <span class="req">*</span></label>
          <input type="text" id="bk-name" placeholder="e.g. Karim Ahmed" />
        </div>
        <div class="fg">
          <label class="fl">Phone number <span class="req">*</span></label>
          <input type="tel" id="bk-phone" placeholder="+880 XXXX-XXXXXX" />
        </div>
        <div class="fg">
          <label class="fl">Email address</label>
          <input type="email" id="bk-email" placeholder="you@example.com" />
        </div>
        <div class="fg">
          <label class="fl">Relation to couple</label>
          <select id="bk-rel">
            <option value="">Select…</option>
            <option>Bride herself</option>
            <option>Groom himself</option>
            <option>Parent of bride</option>
            <option>Parent of groom</option>
            <option>Sibling</option>
            <option>Friend / Relative</option>
            <option>Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="sec-block">
      <div class="sec-title"><em>Bride</em> &amp; Groom</div>
      <div class="g2">
        <div class="fg">
          <label class="fl">Bride's full name <span class="req">*</span></label>
          <input type="text" id="bride" placeholder="e.g. Nadia Rahman" />
        </div>
        <div class="fg">
          <label class="fl">Groom's full name <span class="req">*</span></label>
          <input type="text" id="groom" placeholder="e.g. Sabbir Hossain" />
        </div>
        <div class="fg">
          <label class="fl">Bride's phone</label>
          <input type="tel" id="bride-ph" placeholder="+880" />
        </div>
        <div class="fg">
          <label class="fl">Groom's phone</label>
          <input type="tel" id="groom-ph" placeholder="+880" />
        </div>
      </div>
    </div>

    <div class="fnav">
      <span></span>
      <button class="btn-next" onclick="goTo(2)">Next: Events &rarr;</button>
    </div>
  </div>

  <!-- ══ PAGE 2 — EVENTS ══ -->
  <div class="fpage" id="pg2">
    <div class="sec-block">
      <div class="sec-title">Event details</div>
      <p style="font-size:13px;color:var(--mist);margin-bottom:18px;">Add every event — Holud, Akd, Reception, Bou Bhat, etc.</p>
      <div class="ev-list" id="ev-list"></div>
      <button class="add-ev" onclick="addEv()">+ Add another event</button>
    </div>
    <div class="fnav">
      <button class="btn-back" onclick="goTo(1)">&larr; Back</button>
      <button class="btn-next" onclick="goTo(3)">Next: Package &rarr;</button>
    </div>
  </div>

  <!-- ══ PAGE 3 — PACKAGE ══ -->
  <div class="fpage" id="pg3">

    <div class="sec-block">
      <div class="sec-title">Select <em>package</em></div>
      <div class="pkg-grid" id="pkg-grid"></div>
    </div>

    <div class="sec-block">
      <div class="sec-title">Price &amp; payment</div>
      <div class="g2">
        <div class="fg">
          <label class="fl">Custom package name (if combo)</label>
          <input type="text" id="custom-pkg" placeholder="e.g. Grace + Drone add-on" />
        </div>
        <div class="fg">
          <label class="fl">Total package price (BDT) <span class="req">*</span></label>
          <input type="number" id="pkg-price" placeholder="e.g. 24000" oninput="calcBal()" />
        </div>
        <div class="fg">
          <label class="fl">Advance paid (BDT) <span class="req">*</span></label>
          <input type="number" id="advance" placeholder="e.g. 12000" oninput="calcBal()" />
        </div>
        <div class="fg">
          <label class="fl">Balance due (auto-calculated)</label>
          <input type="text" id="balance" readonly placeholder="—" />
        </div>
      </div>
    </div>

    <div class="sec-block">
      <div class="sec-title">Special requirements</div>
      <div class="g1">
        <div class="fg">
          <label class="fl">Notes / extra services / social media opt-out</label>
          <textarea id="notes" placeholder="Any specific instructions, song preferences for video, outdoor requirements, extra add-ons…"></textarea>
        </div>
      </div>
    </div>

    <div class="fnav">
      <button class="btn-back" onclick="goTo(2)">&larr; Back</button>
      <button class="btn-next" onclick="buildInvoice()">Generate Invoice &rarr;</button>
    </div>
  </div>

  <!-- ══ PAGE 4 — INVOICE ══ -->
  <div class="fpage" id="pg4">
    <div class="inv-box" id="inv-box"></div>
    <div class="inv-actions">
      <button class="btn-print" onclick="window.print()">&#128438;&nbsp; Print / Save PDF</button>
      <button class="btn-sheet" id="btn-sheet" onclick="saveSheet()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        Save to Google Sheets
      </button>
      <button class="btn-new" onclick="startNew()">+ New Booking</button>
    </div>
    <div class="sheet-msg" id="sheet-msg"></div>
  </div>

</div><!-- /wrap -->

<script>
/* ================================================================
   GOOGLE SHEETS — SETUP INSTRUCTIONS
   ────────────────────────────────────────────────────────────────
   1. Go to sheets.google.com → create a new spreadsheet
   2. Name the first sheet:  Bookings
   3. Add these headers in row 1 (A1 to M1):
      Invoice No | Date | Booking Person | Phone | Email |
      Bride | Groom | Events | Package | Total BDT |
      Advance BDT | Balance BDT | Notes

   4. In the spreadsheet: Extensions → Apps Script
      Paste this code and save:

        function doPost(e) {
          var sheet = SpreadsheetApp.getActiveSpreadsheet()
                        .getSheetByName('Bookings');
          var data = JSON.parse(e.postData.contents);
          sheet.appendRow(data.row);
          return ContentService.createTextOutput('OK');
        }

   5. Click Deploy → New deployment → Web app
      Execute as: Me  |  Who can access: Anyone
      → Deploy → Copy the Web App URL

   6. Paste the URL below replacing YOUR_APPS_SCRIPT_URL
================================================================ */
const SHEETS_URL = 'YOUR_APPS_SCRIPT_URL'; // ← paste here

/* ── PACKAGE DATA ── */
const PKGS = [
  { cat:'Prelude',   name:'Classic',                     price:12000  },
  { cat:'Prelude',   name:'Prestige',                    price:25000  },
  { cat:'Essential', name:'Bloom',                       price:16000  },
  { cat:'Essential', name:'Grace',                       price:24000  },
  { cat:'Essential', name:'Eternity',                    price:32000  },
  { cat:'Signature', name:'Standard',                    price:28000  },
  { cat:'Signature', name:'Platinum',                    price:36000  },
  { cat:'Signature', name:'Signature',                   price:44000  },
  { cat:'Signature', name:'Premium',                     price:60000  },
  { cat:'Heirloom',  name:'Documentary & Story Telling', price:80000  },
  { cat:'Heirloom',  name:'Destination Wedding',         price:120000 },
  { cat:'Custom',    name:'Custom / Combo',              price:0      },
];

const EV_TYPES = ['Holud','Mehendi Night','Akd / Nikah','Biye (Wedding)','Reception','Bou Bhat','Pre-Wedding Shoot','Post-Wedding Shoot','Engagement','Other'];

/* ── STEP NAVIGATION ── */
let curStep = 1;
let savedData = {};
let evCount = 0;

function goTo(n) {
  if (n > curStep && !validate(curStep)) return;
  curStep = n;
  document.querySelectorAll('.fpage').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.step-tab').forEach((t, i) => {
    t.classList.remove('active','done');
    if (i + 1 === n) t.classList.add('active');
    if (i + 1 < n)   t.classList.add('done');
  });
  document.getElementById('pg' + n).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── VALIDATION ── */
function validate(step) {
  if (step === 1) {
    const fields = [
      { id:'bk-name',  label:'Booking person name' },
      { id:'bk-phone', label:'Phone number' },
      { id:'bride',    label:"Bride's name" },
      { id:'groom',    label:"Groom's name" },
    ];
    let ok = true;
    fields.forEach(f => {
      const el = document.getElementById(f.id);
      el.classList.remove('err');
      if (!el.value.trim()) { el.classList.add('err'); ok = false; }
    });
    if (!ok) alert('Please fill in all required fields marked with *');
    return ok;
  }
  if (step === 2) {
    const rows = document.querySelectorAll('.ev-row');
    if (rows.length === 0) { alert('Add at least one event.'); return false; }
    return true;
  }
  if (step === 3) {
    const price   = document.getElementById('pkg-price');
    const advance = document.getElementById('advance');
    let ok = true;
    [price, advance].forEach(f => {
      f.classList.remove('err');
      if (!f.value || isNaN(f.value) || parseFloat(f.value) < 0) { f.classList.add('err'); ok = false; }
    });
    if (!ok) { alert('Please enter valid price and advance amounts.'); return false; }
    if (parseFloat(advance.value) > parseFloat(price.value)) {
      alert('Advance cannot exceed the total price.'); return false;
    }
    return true;
  }
  return true;
}

/* ── EVENT ROWS ── */
function addEv(pre) {
  evCount++;
  const div = document.createElement('div');
  div.className = 'ev-row';
  div.dataset.i = evCount;
  div.innerHTML =
    '<div class="fg">' +
      '<label class="fl">Event type</label>' +
      '<select class="ev-type">' +
        EV_TYPES.map(t => '<option' + (pre && pre.type===t?' selected':'') + '>' + t + '</option>').join('') +
      '</select>' +
    '</div>' +
    '<div class="fg">' +
      '<label class="fl">Date <span class="req">*</span></label>' +
      '<input type="date" class="ev-date" value="' + (pre ? pre.date : '') + '" />' +
    '</div>' +
    '<div class="fg">' +
      '<label class="fl">Start time</label>' +
      '<input type="time" class="ev-time" value="' + (pre ? pre.time : '') + '" />' +
    '</div>' +
    '<div class="fg">' +
      '<label class="fl">Venue name &amp; area</label>' +
      '<input type="text" class="ev-venue" placeholder="e.g. Radisson Blu, Dhaka" value="' + (pre ? pre.venue : '') + '" />' +
    '</div>' +
    '<button class="ev-del" onclick="delEv(this)" title="Remove">&times;</button>';
  document.getElementById('ev-list').appendChild(div);
}

function delEv(btn) {
  const rows = document.querySelectorAll('.ev-row');
  if (rows.length <= 1) { alert('At least one event is required.'); return; }
  btn.closest('.ev-row').remove();
}

function getEvents() {
  return Array.from(document.querySelectorAll('.ev-row')).map(r => ({
    type:  r.querySelector('.ev-type').value,
    date:  r.querySelector('.ev-date').value,
    time:  r.querySelector('.ev-time').value,
    venue: r.querySelector('.ev-venue').value,
  }));
}

/* ── PACKAGE RADIO ── */
function buildPkgs() {
  document.getElementById('pkg-grid').innerHTML = PKGS.map((p, i) =>
    '<div class="pkg-opt">' +
      '<input type="radio" name="pkg" id="pk' + i + '" value="' + i + '" onchange="selectPkg(' + i + ')">' +
      '<label class="pkg-label" for="pk' + i + '">' +
        '<div class="pkg-cat">' + p.cat + '</div>' +
        '<div class="pkg-name">' + p.name + '</div>' +
        '<div class="pkg-price">' + (p.price ? 'BDT ' + p.price.toLocaleString() : 'Enter price below') + '</div>' +
      '</label>' +
    '</div>'
  ).join('');
}

function selectPkg(i) {
  const p = PKGS[i];
  if (p.price) { document.getElementById('pkg-price').value = p.price; calcBal(); }
  if (p.name !== 'Custom / Combo') document.getElementById('custom-pkg').value = '';
}

function calcBal() {
  const price   = parseFloat(document.getElementById('pkg-price').value)  || 0;
  const advance = parseFloat(document.getElementById('advance').value)     || 0;
  const bal     = Math.max(0, price - advance);
  document.getElementById('balance').value = bal > 0 ? 'BDT ' + bal.toLocaleString() : 'BDT 0';
}

/* ── HELPERS ── */
function invNo() {
  const d = new Date();
  return 'RC-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + (Math.floor(Math.random()*900)+100);
}
function pad(n) { return String(n).padStart(2,'0'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  return (hr > 12 ? hr - 12 : hr || 12) + ':' + m + ' ' + (hr >= 12 ? 'PM' : 'AM');
}
function today() {
  return new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
}

/* ── BUILD INVOICE ── */
function buildInvoice() {
  if (!validate(3)) return;

  const selPkg = document.querySelector('input[name=pkg]:checked');
  const pkgIdx = selPkg ? parseInt(selPkg.value) : -1;
  const autoPkg = pkgIdx >= 0 && PKGS[pkgIdx].name !== 'Custom / Combo' ? PKGS[pkgIdx].name : '';
  const customPkg = document.getElementById('custom-pkg').value.trim();
  const pkgName = customPkg || autoPkg || 'Custom Package';

  const price   = parseFloat(document.getElementById('pkg-price').value) || 0;
  const advance = parseFloat(document.getElementById('advance').value)   || 0;
  const balance = price - advance;
  const events  = getEvents();
  const no      = invNo();

  savedData = {
    no, today: today(),
    bkName:   document.getElementById('bk-name').value.trim(),
    bkPhone:  document.getElementById('bk-phone').value.trim(),
    bkEmail:  document.getElementById('bk-email').value.trim(),
    bkRel:    document.getElementById('bk-rel').value,
    bride:    document.getElementById('bride').value.trim(),
    groom:    document.getElementById('groom').value.trim(),
    bridePh:  document.getElementById('bride-ph').value.trim(),
    groomPh:  document.getElementById('groom-ph').value.trim(),
    events, pkgName, price, advance, balance,
    notes: document.getElementById('notes').value.trim(),
  };

  const evRows = events.map((e, i) =>
    '<tr>' +
      '<td><strong>' + (i+1) + '. ' + e.type + '</strong>' +
        '<span class="sub">' + fmtDate(e.date) + (e.time ? ' &nbsp;·&nbsp; ' + fmtTime(e.time) : '') + '</span>' +
      '</td>' +
      '<td>' + (e.venue || '—') + '</td>' +
      '<td class="right">' + (i === 0 ? 'Package total' : '—') + '</td>' +
    '</tr>'
  ).join('');

  document.getElementById('inv-box').innerHTML =
    '<div class="inv-head">' +
      '<div>' +
        '<div class="inv-logo">Retro <em>Canvas</em></div>' +
        '<div class="inv-logo-sub">Wedding Photography &amp; Cinematography<br>Dhaka, Bangladesh<br>+880 1887-303536 &nbsp;·&nbsp; rc.retrocanvas@gmail.com</div>' +
      '</div>' +
      '<div class="inv-meta">' +
        '<div class="inv-title">Booking Invoice</div>' +
        '<div class="inv-meta-detail">Invoice No: <strong>' + no + '</strong><br>Date: ' + today() + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="inv-parties">' +
      '<div>' +
        '<div class="inv-party-lbl">Booked by' + (savedData.bkRel ? ' (' + savedData.bkRel + ')' : '') + '</div>' +
        '<div class="inv-party-name">' + savedData.bkName + '</div>' +
        '<div class="inv-party-det">' +
          savedData.bkPhone +
          (savedData.bkEmail ? '<br>' + savedData.bkEmail : '') +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="inv-party-lbl">Couple</div>' +
        '<div class="inv-party-name">' + savedData.bride + ' &amp; ' + savedData.groom + '</div>' +
        '<div class="inv-party-det">' +
          (savedData.bridePh ? 'Bride: ' + savedData.bridePh + '<br>' : '') +
          (savedData.groomPh ? 'Groom: ' + savedData.groomPh : '') +
        '</div>' +
      '</div>' +
    '</div>' +

    '<table class="inv-tbl">' +
      '<thead><tr><th>Event</th><th>Venue</th><th class="right">Details</th></tr></thead>' +
      '<tbody>' + evRows + '</tbody>' +
    '</table>' +

    '<div style="display:flex;justify-content:flex-end;">' +
      '<div class="inv-totals">' +
        '<div class="inv-row pkg-row"><span>' + pkgName + '</span><span>BDT ' + price.toLocaleString() + '</span></div>' +
        '<div class="inv-row adv"><span>Advance paid</span><span>BDT ' + advance.toLocaleString() + '</span></div>' +
        '<div class="inv-row bal"><span>Balance due</span><span>BDT ' + balance.toLocaleString() + '</span></div>' +
      '</div>' +
    '</div>' +

    (savedData.notes ?
      '<div class="inv-terms"><strong>Client Notes</strong>' + savedData.notes + '</div>' : '') +

    '<div class="inv-terms"><strong>Terms &amp; Conditions</strong>' +
      '50% advance required for booking confirmation. Balance due upon raw file delivery (within 2 days of last event). ' +
      'Final edited delivery: 2–4 weeks. Song selections for video must be submitted within 1 week of event. ' +
      'Outside Dhaka: additional transport &amp; accommodation costs + 25% surcharge applies. ' +
      'Social media opt-out: additional 20% of package cost.' +
    '</div>' +

    '<div class="inv-foot">' +
      '<div class="inv-foot-brand">Retro <em>Canvas</em></div>' +
      '<div class="inv-foot-right">rc.retrocanvas@gmail.com &nbsp;·&nbsp; +880 1887-303536<br>@retrocanvas.bd &nbsp;·&nbsp; RetroCanvasStudio</div>' +
    '</div>';

  goTo(4);
}

/* ── SAVE TO GOOGLE SHEETS ── */
async function saveSheet() {
  const msg = document.getElementById('sheet-msg');
  const btn = document.getElementById('btn-sheet');

  if (!SHEETS_URL || SHEETS_URL === 'YOUR_APPS_SCRIPT_URL') {
    msg.className = 'sheet-msg err';
    msg.innerHTML =
      '<strong>Google Sheets not connected yet.</strong><br>' +
      'Open this file in VS Code, find the line <code>const SHEETS_URL =</code> and paste your Apps Script URL there.<br>' +
      'See the comment block above it for full setup instructions.';
    return;
  }

  btn.textContent = 'Saving…';
  btn.disabled = true;

  const evSummary = savedData.events.map(e =>
    e.type + (e.date ? ' · ' + fmtDate(e.date) : '') + (e.venue ? ' @ ' + e.venue : '')
  ).join(' | ');

  const row = [
    savedData.no,
    savedData.today,
    savedData.bkName,
    savedData.bkPhone,
    savedData.bkEmail,
    savedData.bride,
    savedData.groom,
    evSummary,
    savedData.pkgName,
    savedData.price,
    savedData.advance,
    savedData.balance,
    savedData.notes,
  ];

  try {
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode:   'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body:   JSON.stringify({ row }),
    });
    msg.className = 'sheet-msg ok';
    msg.textContent = '✓ Saved to Google Sheets — Invoice ' + savedData.no;
  } catch (e) {
    msg.className = 'sheet-msg err';
    msg.textContent = '✗ Could not save. Check your Apps Script URL and try again.';
  }

  btn.disabled = false;
  btn.innerHTML =
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Save to Google Sheets';
}

/* ── NEW BOOKING ── */
function startNew() {
  if (!confirm('Start a new booking? This will clear the current form.')) return;
  document.querySelectorAll('input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],textarea').forEach(f => f.value = '');
  document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  document.querySelectorAll('input[type=radio]').forEach(r => r.checked = false);
  document.getElementById('ev-list').innerHTML = '';
  document.getElementById('sheet-msg').className = 'sheet-msg';
  evCount = 0;
  addEv();
  goTo(1);
}

/* ── INIT ── */
buildPkgs();
addEv();
</script>
